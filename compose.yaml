name: university-helpdesk

# Every secret comes from .env (see .env.example); nothing secret is stored in this file.

# The API publishes and the worker consumes with exactly these settings, so both declare and use
# the same exchange, queue, and binding.
x-rabbitmq-settings: &rabbitmq-settings
  RabbitMq__HostName: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: helpdesk
  RabbitMq__UserName: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
  RabbitMq__Exchange: helpdesk.events
  RabbitMq__TicketResolvedQueue: helpdesk.ticket-resolved

x-database-settings: &database-settings
  ConnectionStrings__HelpdeskDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18 images keep data in a version-specific folder under this path.
      - postgres-data:/var/lib/postgresql
      # Runs only when the volume is first created: adds the helpdesk_test database for the tests.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # RabbitMQ names its data folder after the host name, so keep it fixed across container re-creation.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: helpdesk
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-55672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-55673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.2-alpine
    # Only a cache: nothing needs to survive a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-51025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-58025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off step before the API starts: applies migrations, then creates any missing demo
  # accounts. Both are safe to repeat, so it runs on every `docker compose up`.
  db-init:
    build:
      context: .
      dockerfile: backend/UniversityHelpdesk.Api/Dockerfile
    image: university-helpdesk-api:local
    command: ["migrate-database", "seed-demo-users"]
    environment:
      <<: *database-settings
      # Demo accounts are created only in Development.
      ASPNETCORE_ENVIRONMENT: Development
      DemoAccounts__Student1Password: ${DEMO_STUDENT1_PASSWORD:?Set DEMO_STUDENT1_PASSWORD in .env}
      DemoAccounts__Student2Password: ${DEMO_STUDENT2_PASSWORD:?Set DEMO_STUDENT2_PASSWORD in .env}
      DemoAccounts__Technician1Password: ${DEMO_TECHNICIAN1_PASSWORD:?Set DEMO_TECHNICIAN1_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/UniversityHelpdesk.Api/Dockerfile
    image: university-helpdesk-api:local
    deploy:
      replicas: 2
    environment:
      <<: [*database-settings, *rabbitmq-settings]
      # Development enables Swagger for this local stack.
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Redis__Configuration: redis:6379
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Single entry point: serves the React frontend (built from frontend/ with its lockfile) and
  # load-balances API requests across the API replicas (deploy/gateway.conf).
  gateway:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: university-helpdesk-gateway:local
    ports:
      - "127.0.0.1:${API_HOST_PORT:-58080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/UniversityHelpdesk.NotificationWorker/Dockerfile
    image: university-helpdesk-worker:local
    environment:
      <<: *rabbitmq-settings
      RabbitMq__FailedQueue: helpdesk.ticket-resolved.failed
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Health__FilePath: /tmp/notification-worker.alive
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      # Healthy while the worker keeps rewriting its health file, which it does only while consuming.
      test: ["CMD-SHELL", "find /tmp/notification-worker.alive -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
