# Load balancer in front of the API replicas in Docker Compose.
# Docker's DNS returns one address per replica; resolving at request time keeps the list current
# when replicas are recreated, and nginx rotates between the addresses.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;

    # Metrics are per replica and only for monitoring inside the Compose network.
    location = /metrics {
        return 404;
    }

    location / {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout;
    }
}
