# The single entry point in Docker Compose: serves the React frontend and load-balances API
# requests across the API replicas. Docker's DNS returns one address per replica; resolving at
# request time keeps the list current when replicas are recreated, and nginx rotates between the
# addresses.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Metrics are per replica and only for monitoring inside the Compose network.
    location = /metrics {
        return 404;
    }
    location = /api/metrics {
        return 404;
    }

    # The React app calls the API under /api; the prefix is removed before forwarding.
    location /api/ {
        set $api http://api:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout;
    }

    # The documented API paths stay available without the prefix, for Swagger, Postman, and probes.
    location ~ ^/(auth|tickets|categories|health|swagger)(/|$) {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout;
    }

    # Built files have a content hash in their name, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Every other path is a page of the app: serve the file if it exists, otherwise index.html, so
    # direct links and refreshes on routes such as /student/tickets/42 work.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy same-origin;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
        try_files $uri /index.html;
    }
}
